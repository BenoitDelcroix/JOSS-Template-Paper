name: Production PDF

on: [push]

jobs:
  paper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build production PDF
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/data \
            -e JOURNAL=joss \
            openjournals/inara \
            -o pdf -p paper.md

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: paper
          path: paper.pdf