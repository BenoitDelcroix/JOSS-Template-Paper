name: PDF Build
on: [push]

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Build PDF
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build PDF with Pandoc
        uses: docker://pandoc/latex:latest
        with:
          args: >-
            paper.md
            --citeproc
            --output=paper-pandoc.pdf
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper-pandoc.pdf